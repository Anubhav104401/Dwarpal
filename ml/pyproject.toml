[project]
name = "dwarpal-ml"
version = "0.1.0"
description = "Dwarpal machine learning: datasets, training, evaluation, risk control, export and model cards."
requires-python = ">=3.13,<3.14"
dependencies = [
  "dwarpal-vision",
  "httpx==0.28.1",
  "onnx==1.23.2",
  "onnxruntime==1.31.0",
  "onnxscript==0.7.2",
  "scipy==1.18.1",
  "timm==1.0.30",
  "torch==2.14.1",
  "torchvision==0.29.1",
]

[tool.uv.sources]
dwarpal-vision = { workspace = true }
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"
