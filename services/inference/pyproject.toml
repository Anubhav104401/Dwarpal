[project]
name = "dwarpal-inference"
version = "0.1.0"
description = "Dwarpal inference service: face analysis, liveness signals and age distributions, in memory only."
requires-python = ">=3.13,<3.14"
dependencies = [
  "anyio==4.15.1",
  "dwarpal-contracts",
  "dwarpal-vision",
  "fastapi==0.143.0",
  "pydantic-settings==2.15.0",
  "python-multipart==0.0.32",
  "uvicorn==0.54.0",
]

[tool.uv.sources]
dwarpal-contracts = { workspace = true }
dwarpal-vision = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"
