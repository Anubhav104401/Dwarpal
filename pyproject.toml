# Dwarpal — root of the Python workspace.
# This file is not a package itself: it lists the workspace members,
# the shared developer tools, and the settings those tools use.

[tool.uv]
required-version = ">=0.13.1"
default-groups = ["dev", "docs"]
# A 7-day cooldown, as for JavaScript (pnpm-workspace.yaml): brand-new releases are where attacks and bugs show up first.
exclude-newer = "7 days"
# Patched versions of packages that pip-audit and Trivy flagged (decision D15, approved 1 Nov 2026), forced on the whole
# tree. Pillow comes in through torchvision, for training only.
override-dependencies = ["pillow==13.0.0", "certifi==2026.10.19", "filelock==4.2.1", "setuptools==84.1.0"]

[tool.uv.workspace]
members = ["services/*", "libs/*", "ml", "packages/sdk-python"]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "hypothesis==6.168.5",
  "mypy==2.4.0",
  "onnx==1.23.2",
  "pytest==9.1.1",
  "ruff==0.17.0",
  "schemathesis==4.31.1",
  "scipy-stubs==1.18.1.1",
  "testcontainers==4.15.0",
  "types-docker==7.2.0.20261006",
]
docs = [
  "markdown==3.11",
  "pygments==2.21.0",
  "types-markdown==3.10.2.20261007",
  "types-pygments==2.21.0.20260819",
]

[tool.ruff]
line-length = 120
target-version = "py313"
include = ["*.py", "*.pyi", "**/pyproject.toml"]
extend-exclude = ["docs/zero_to_hero/.snapshots"]
src = ["services/api/src", "services/inference/src", "libs/contracts/src", "libs/vision/src", "ml/src", "docs/zero_to_hero"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "PTH", "S", "N", "RUF", "DTZ", "PERF", "RET"]

[tool.ruff.lint.per-file-ignores]
"tasks.py" = ["S603"]
"**/tests/**" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
explicit_package_bases = true
exclude = ['[/\\]\.snapshots[/\\]']
mypy_path = "services/api/src,services/inference/src,libs/contracts/src,libs/vision/src,ml/src,packages/sdk-python/src,docs/zero_to_hero,services/api/tests"
files = [
  "tasks.py",
  "infra/scripts",
  "docs/zero_to_hero",
  "services/api/src",
  "services/api/tests",
  "services/inference/src",
  "services/inference/tests",
  "libs/contracts/src",
  "libs/vision/src",
  "libs/vision/tests",
  "ml/src",
  "ml/tests",
  "packages/sdk-python/src",
  "packages/sdk-python/tests",
]

# timm re-exports its public names without marking them as such.
[[tool.mypy.overrides]]
module = ["timm.*"]
implicit_reexport = true

# ONNX Runtime and ONNX ship no complete type information.
[[tool.mypy.overrides]]
module = ["onnxruntime.*", "onnx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["docs/zero_to_hero/tests", "services", "libs", "ml", "packages/sdk-python"]
pythonpath = ["docs/zero_to_hero", "services/api/tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
