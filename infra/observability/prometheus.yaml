# Prometheus (Phase 7, D11): collects the API's metrics from the collector every 15 seconds, keeps them, and checks the
# alert rules against them.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yaml

scrape_configs:
  - job_name: dwarpal
    static_configs:
      - targets: ["collector:8889"]
