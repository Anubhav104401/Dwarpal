title = "Dwarpal — Zero to Hero"
subtitle = "Building a privacy-first AI age-assurance system, starting from absolutely nothing"
output = "zero_to_hero.html"
abbreviations = "abbreviations.md"
chapters = [
  "chapters/00_front_matter.md",
  "chapters/01_part0_basics.md",
  "chapters/02_part1_problem.md",
  "chapters/03_part2_ai.md",
  "chapters/04_part3_thinking.md",
  "chapters/05_part4_tools.md",
  "chapters/06_part5_build.md",
  "chapters/07_part5_phase1.md",
  "chapters/08_part5_phase2.md",
  "chapters/09_part5_phase3.md",
  "chapters/10_part5_phase4.md",
  "chapters/11_part5_phase5.md",
  "chapters/12_part5_phase6.md",
  "chapters/13_part5_phase7.md",
  "chapters/14_part5_phase8.md",
  "chapters/15_part5_phase9.md",
  "chapters/16_part6_launch_night.md",
  "chapters/17_part7_aadhaar.md",
  "chapters/90_how_this_book_is_built.md",
  "chapters/98_ledger.md",
  "chapters/99_glossary.md",
]

[coverage]
include = [
  "**/*.py", "**/*.ts", "**/*.tsx", "**/*.js", "**/*.mjs", "**/*.css", "**/*.html",
  "**/*.toml", "**/*.yaml", "**/*.yml", "**/*.json", "**/*.sql", "**/*.sh", "**/*.ps1",
  "**/*.txt", "**/Dockerfile", "**/Caddyfile", "**/.env.example",
  "**/.gitignore", "**/.dockerignore", "**/.gitattributes", "**/.editorconfig", "**/.python-version", "**/*.mako",
]
exclude = ["docs/zero_to_hero/zero_to_hero.html", "docs/api/openapi.json", "**/pnpm-lock.yaml", "**/package-lock.json", "**/uv.lock", "**/next-env.d.ts", "apps/web/public/mediapipe/**"]
prune = [
  ".git", ".venv", "node_modules", "__pycache__", ".next", ".turbo", "dist",
  ".datasets", ".runs", "mlruns", ".mypy_cache", ".ruff_cache", ".pytest_cache", ".hypothesis", ".snapshots", ".claude", "test-results", "playwright-report",
  ".lighthouseci", ".scan", ".tools",
]
